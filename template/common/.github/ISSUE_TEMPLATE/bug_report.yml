name: Bug report
description: Something in __SLUG__ behaved incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please include enough detail to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command(s) and inputs. A minimal example helps most.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: __SLUG__ version, OS, and how you ran it.
      placeholder: |
        __SLUG__: 0.1.0
        os: macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Command output or logs. Redact anything private.
      render: text
    validations:
      required: false
