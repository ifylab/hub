[project]
name = "__SLUG__"
version = "0.1.0"
description = "__DESC__"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Hossein Zargar" }]
keywords = []
dependencies = []

[project.urls]
Homepage = "https://ifylab.dev"
Repository = "https://github.com/ifylab/__SLUG__"

[project.scripts]
__SLUG__ = "__PACKAGE__.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PACKAGE__"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
python-version = "3.12"
